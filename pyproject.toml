[project]
name = "alice-emulator"
version = "0.1.0"
description = "Эмулятор сервера Яндекс Алисы: HTTP, WebSocket и AAPI для колонок, сценарии, расширения"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.11,<4",
  "authlib>=1.3,<2",
  "mcp>=1.26,<2",
  "protobuf>=5,<8",
  "grpcio-tools>=1.60,<2",
  "zstandard>=0.23,<1",
  "cryptography>=43,<48",
  "androguard>=4.1,<5",
  "numpy>=2,<3",
  "soxr>=1,<2",
  "PyOgg==0.6.14a1",
  "langchain>=1.4,<2",
  "litellm>=1.109.0,!=1.82.7,!=1.82.8,<2",
  "langgraph>=1.2,<2",
  "aiosqlite>=0.20,<1",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "langmem>=0.0.30,<0.1",
  "apscheduler>=3.11,<4",
  "ddgs>=9,<10",
  "trafilatura>=2,<3",
  "httpx>=0.28,<1",
  "hassil>=3.12,<4",
  "jinja2>=3.1,<4",
  "pydantic>=2,<3",
  "pymorphy3>=2.0,<3",
  "aiodns>=3.2,<4",
  "dulwich>=0.22,<1",
  "packaging>=23,<26",
  "jsonpointer>=3,<4",
  "yandex-music>=3.2,<4",
  "requests>=2.28,<3",
  "alembic>=1.13,<2",
  "sqlalchemy>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-xdist>=3.6,<4"]
windows = ["pystray>=0.19,<1; sys_platform == 'win32'", "Pillow>=10,<13; sys_platform == 'win32'"]
# полная установка одной командой: базовые зависимости + трей Windows; состав как у windows
emulator = ["pystray>=0.19,<1; sys_platform == 'win32'", "Pillow>=10,<13; sys_platform == 'win32'"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server_emulator*"]

[tool.setuptools.package-data]
server_emulator = ["ui/*", "schemas/*.pb", "requirements.txt", "voice_stack/packages/*.json",
                   "plugins/*/extension.json", "plugins/*/music/*.py", "plugins/*/phrases/*.json",
  "plugins/*/weather/*.py", "plugins/*/news/*.py", "plugins/*/README.md",
  "plugins/*/actions/*.py", "plugins/*/datasets/*.py", "plugins/*/modes/*.py", "plugins/*/hooks.py",
  "plugins/*/ha_common.py", "plugins/*/mcp/*.json", "plugins/*/scenarios/**/*.json",
  "plugins/*/scenarios/**/*.py", "plugins/*/voice/adapters/*.py", "plugins/*/voice/presets/*.json",
  "quasar_defaults/*.json", "quasar_defaults/platforms/*.json", "quasar_defaults/README.md",
  "oauth_static/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-n 4 --dist loadgroup"
